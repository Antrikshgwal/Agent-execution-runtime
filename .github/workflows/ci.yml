name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an older run's answer worthless, so stop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint and import graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The gemini extra is installed so pylint can resolve the imports in
      # planner.py's gemini branch. Nothing here calls a provider.
      - run: pip install -e ".[dev,gemini]" -r mock/requirements.txt
      # --recursive=y because tests/, mock/, and tools/ are directories of
      # scripts rather than packages, and pylint treats a bare directory as one.
      - run: pylint --recursive=y src tests mock tools
      - name: the import graph still runs one way
        run: python tools/check_imports.py

  docs:
    name: diagrams parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - run: node tools/check_diagrams.mjs README.md ARCHITECTURE.md

  package:
    name: build and install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: the wheel installs and both entry points resolve
        shell: bash
        run: |
          set -euo pipefail
          pip install dist/*.whl
          python -c "import agent_runtime; print(agent_runtime.__version__)"
          python -c "from agent_runtime.runtime import run_cli; print(run_cli.__doc__)"
          command -v agent-runtime

  proofs:
    name: proofs (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: durable
          POSTGRES_USER: durable
          POSTGRES_PASSWORD: durable
        # 5433 on the host, as mock/docker-compose.yml publishes it, so the
        # default DATABASE_URL in config.py is the one CI exercises.
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U durable -d durable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://durable:durable@localhost:5433/durable
      # The scripted planner, always. A run that paid a provider and picked a
      # different plan each time would prove nothing, and would cost money per push.
      PLANNER: mock
      MOCK_CLOUD_URL: http://localhost:9000
      MOCK_LLM_URL: http://localhost:9100

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . -r mock/requirements.txt

      - name: load the schema, twice
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql

      - name: start both mocks
        working-directory: mock
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          uvicorn mock_cloud:app --port 9000 > "$GITHUB_WORKSPACE/logs/mock_cloud.log" 2>&1 &
          uvicorn mock_llm:app --port 9100 > "$GITHUB_WORKSPACE/logs/mock_llm.log" 2>&1 &
          for url in "$MOCK_CLOUD_URL/created" "$MOCK_LLM_URL/calls"; do
            timeout 60 bash -c "until curl -sf '$url' > /dev/null; do sleep 0.5; done"
          done
          python check_setup.py

      # Sequential on purpose. Each harness truncates all three tables, and the
      # mocks carry state the crash proofs read: one key map and one call counter,
      # shared by whatever is running. Two harnesses at once would void both.
      - name: fencetest
        run: |
          set -o pipefail
          python tests/fencetest.py 2>&1 | tee logs/fencetest.log

      - name: crashtest, crashing on the first step
        run: |
          set -o pipefail
          python tests/crashtest.py 2>&1 | tee logs/crashtest.log

      - name: crashtest, crashing partway through
        run: |
          set -o pipefail
          python tests/crashtest.py --seq 2 2>&1 | tee logs/crashtest-seq2.log

      - name: racetest
        run: |
          set -o pipefail
          python tests/racetest.py 2>&1 | tee logs/racetest.log

      # The log is what a human reads after an incident, and what the harnesses
      # assert on, so keep it when a run fails.
      - name: keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-py${{ matrix.python-version }}
          path: logs/
          retention-days: 7
